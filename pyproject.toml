[project]
name = "ai-passage-creator-backend"
version = "0.0.1"
description = "AI 爆款文章创作器 - Python 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "python-multipart>=0.0.32,<0.1",
    "sqlalchemy>=2.0.55,<2.1",
    "pymysql>=1.2.3,<2.0",
    "cryptography>=50.0.2,<51",
    "databases[mysql]>=0.9,<0.10",
    "redis>=8.1,<9.0",
    "pydantic>=2.14.2,<3.0",
    "pydantic-settings>=2.16.2,<3.0",
    "openai>=3.42,<4.0",
    "httpx>=0.28.1,<1.0",
    "cos-python-sdk-v5>=1.9.44,<2.0",
    "google-genai>=2.34,<3.0",
    "beautifulsoup4>=4.15.0,<5.0",
    "lxml>=6.1.3,<7.0",
    "docling-slim[format-office,format-web,format-pdf]>=2.140,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

