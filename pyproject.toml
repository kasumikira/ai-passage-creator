[project]
name = "ai-passage-creator-backend"
version = "0.0.1"
description = "AI 爆款文章创作器 - Python 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.55",
    "pymysql>=1.2.3",
    "cryptography>=50.0.2",
    "databases[mysql]>=0.9",
    "redis>=8.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "openai>=3.42",
    "httpx>=0.28.1",
    "google-genai>=2.34",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "docling-slim[format-office,format-web,format-pdf]>=2.140",
    "json-repair>=0.64.2",
    "mermaidx>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

